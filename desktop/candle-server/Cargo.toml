[package]
name = "candle-server"  # 兼容名;实为 yts GGML 推理网关(文本 llama.cpp / 图片 sd.cpp / 音乐 acestep.cpp)
version = "0.1.0"
edition = "2021"
description = "yts local GGML inference gateway (text→llama-server proxy; image/music→spawned .cpp producers)"

[[bin]]
name = "candle-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }  # 代理 llama-server
hound = "3.5"          # 读取 producer 输出的 WAV(acestep.cpp 输出 48kHz WAV)
image = { version = "0.25", default-features = false, features = ["png"] }  # 读/编码 PNG(sd.cpp 输出)
base64 = "0.22"        # /image 返回 base64 PNG
