[package]
name = "candle-server"
version = "0.1.0"
edition = "2021"
description = "yts local Candle inference HTTP server (text first; image/speech/music TODO)"

[[bin]]
name = "candle-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

candle-core = "0.8"
candle-transformers = "0.8"
tokenizers = "0.20"
hf-hub = "0.3"

# mac Metal 加速(默认开;非 mac 构建时去掉此 feature 或改 cpu)
[features]
default = ["metal"]
metal = ["candle-core/metal"]
