  "-B",
  "{build}",
  "-DCMAKE_BUILD_TYPE=Release",
]
build_argv = ["cmake", "--build", "{build}", "--config", "Release", "--target", "sd-cli", "-j"]
build_dir = "stable-diffusion.cpp/build"
artifact = "stable-diffusion.cpp/build/bin/sd-cli"

