[components.infer-gateway]
enabled = true
platforms = ["darwin-arm64"]
dependencies = ["llama", "stable-diffusion"]
models = []

[components.infer-gateway.source]
kind = "workspace"
source_dir = "desktop/infer-gateway"

[components.infer-gateway.build]
target = "infer-gateway"
configure_argv = []
build_argv = ["cargo", "build", "--manifest-path", "{source}/Cargo.toml", "--release"]
build_dir = "desktop/infer-gateway/target/release"
artifact = "desktop/infer-gateway/target/release/infer-gateway"

[components.infer-gateway.runtime]
kind = "service"
argv = ["{artifact}"]
host = "127.0.0.1"
port = 8799
startup_timeout_seconds = 60
shutdown_timeout_seconds = 15

[components.infer-gateway.runtime.health]
path = "/health"
timeout_seconds = 2

[components.infer-gateway.runtime.readiness]
path = "/ready"
timeout_seconds = 2
