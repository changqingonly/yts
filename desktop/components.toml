[components.stable-diffusion.runtime]
kind = "command"
argv = [
  "{artifact}",
  "--diffusion-model",
  "{model:flux}",
  "--vae",
  "{model:vae}",
  "--clip_l",
  "{model:clip_l}",
  "--t5xxl",
  "{model:t5xxl}",
  "--prompt",
  "{prompt}",
  "--output",
  "{out}",
  "--width",
  "{width}",
  "--height",
  "{height}",
  "--steps",
  "{steps}",
  "--cfg-scale",
  "1.0",
  "--sampling-method",
  "euler",
]
execution_timeout_seconds = 600

