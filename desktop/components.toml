schema_version = 1
vendor_dir = "desktop/vendor"

[components.llama]
enabled = true
platforms = ["darwin-arm64"]
dependencies = []

[components.llama.source]
kind = "external"
url = "https://github.com/ggml-org/llama.cpp.git"
commit = "72874f559c598b8f89fbb24864868337cf5afb4c"
submodules = false
source_dir = "llama.cpp"

[components.llama.build]
target = "llama-server"
configure_argv = [
  "cmake",
  "-S",
  "{source}",
  "-B",
  "{build}",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DLLAMA_CURL=OFF",
]
build_argv = ["cmake", "--build", "{build}", "--config", "Release", "--target", "llama-server", "-j"]
build_dir = "llama.cpp/build"
artifact = "llama.cpp/build/bin/llama-server"

[[components.llama.models]]
id = "qwen"
url = "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf?download=true"
size = 4683074240
sha256 = "65b8fcd92af6b4fefa935c625d1ac27ea29dcb6ee14589c55a8f115ceaaa1423"
path = "llm-models/Qwen2.5-7B-Instruct-Q4_K_M.gguf"

[components.llama.runtime]
kind = "service"
argv = ["{artifact}", "--host", "127.0.0.1", "--port", "8080", "--model", "{model:qwen}"]
host = "127.0.0.1"
port = 8080
startup_timeout_seconds = 120
shutdown_timeout_seconds = 15

[components.llama.runtime.health]
path = "/health"
timeout_seconds = 2

[components.llama.runtime.readiness]
path = "/health"
timeout_seconds = 2

[components.stable-diffusion]
enabled = true
platforms = ["darwin-arm64"]
dependencies = []

[components.stable-diffusion.source]
kind = "external"
url = "https://github.com/leejet/stable-diffusion.cpp.git"
commit = "e790073e1c311feb1ff423ba910f398df01bb60e"
submodules = true
source_dir = "stable-diffusion.cpp"

[components.stable-diffusion.build]
