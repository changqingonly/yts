[project]
name = "yts-core"
version = "0.1.0"
description = "yts transport-agnostic core: LangGraph orchestration + LiteLLM + Pydantic contract + inference ports"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "litellm>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "structlog==26.1.0",
    "tomli>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yts_core"]
