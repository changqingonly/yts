# yts — monorepo root (uv workspace)
# 架构 v3.1：推理=Candle(Rust) / 编排=Python(LangGraph) / 服务端=FastAPI+LangGraph+LiteLLM+Phoenix
# 设计源:../yuetools/docs/tech.html 与 ../yuetools/docs/wiki/(Arch-V3-1 系列)
[project]
name = "yts-workspace"
version = "0.1.0"
description = "yts: transport-agnostic core + FastAPI cloud + Tauri/Candle desktop (v3.1)"
requires-python = ">=3.10"
dependencies = [
    "yts-core",
    "yts-server",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "server"]

[tool.uv.sources]
yts-core = { workspace = true }
yts-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["desktop/frontend", "**/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # 错误/未用/import 排序/语法升级/常见 bug
ignore = ["E501"]                     # 行宽交给 formatter;长中文注释不报

[tool.ruff.format]
quote-style = "double"
